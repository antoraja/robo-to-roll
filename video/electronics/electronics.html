<body>
<canvas id="c" width="1280" height="720"></canvas>

<script src="../node_modules/three/build/three.min.js"></script>
<script src="timeline.js"></script>
<script>
(function () {
const TL = window.TIMELINE; const FPS = 15;
window.FPS = FPS; window.DURATION = TL.total;
const SC = {}; TL.scenes.forEach((s, i) => { s.i = i; SC[s.id] = s; });
const T0 = id => SC[id].t0, T1 = id => SC[id].t0 + SC[id].dur;
const ease = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const sceneAt = t => { let s = TL.scenes[0]; for (const x of TL.scenes) if (t >= x.t0) s = x; return s; };
// time inside a scene, as fraction of its spoken part (so animations follow the voice)
const vt = (id, t, a, b) => { const s = SC[id]; const v0 = s.voice[0], v1 = s.voice[1]; return ramp(t, v0 + (v1 - v0) * a, v0 + (v1 - v0) * b); };

// ------------------------------------------------------------------ three
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1280, 720, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9edf0');
const camera = new THREE.PerspectiveCamera(30, 16 / 9, 1, 5000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x606a74, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(200, 500, 300); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-300, 200, -200); scene.add(fill);
const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);   // Z-up world, mm
const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .55, metalness: .05 }, o || {}));
const M = { table: mat('#d9d3c8', { roughness: .95 }), black: mat('#22272b'), servo: mat('#1d3f73'), white: mat('#f4f4f0'),
  metal: mat('#c8ccd0', { metalness: .7, roughness: .3 }), gold: mat('#d4b25a', { metalness: .7, roughness: .3 }), pcb: mat('#1b1d22'),
  red: mat('#d01f2f'), brown: mat('#6b4a2b'), orange: mat('#f07c18'), blue: mat('#2a62c9'), green: mat('#2f8a52'), cap: mat('#24324f'), spool: mat('#2a9d8f'),
  led: new THREE.MeshBasicMaterial({ color: '#330000' }) };
const table = new THREE.Mesh(new THREE.BoxGeometry(1400, 900, 8), M.table); table.position.set(40, 40, -4); root.add(table);
const box = (w, d, h, m) => new THREE.Mesh(new THREE.BoxGeometry(w, d, h), m);
const cyl = (r, h, m, seg) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 24), m); c.rotation.x = Math.PI / 2; return c; };  // along z

// ------------------------------------------------------------------ breadboard (400 holes)
const PITCH = 2.54, BB_TOP = 8.5;
const colX = c => (c - 15.5) * PITCH;
const ROWY = { a: 13.97, b: 11.43, c: 8.89, d: 6.35, e: 3.81, f: -3.81, g: -6.35, h: -8.89, i: -11.43, j: -13.97, P: 19.7, N: 22.24 };
const hole = (row, c) => new THREE.Vector3(colX(c), ROWY[row], BB_TOP);
function bbTexture() {
  const S = 12, W = 83, H = 55, cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S; const g = cv.getContext('2d');
  g.fillStyle = '#f5f5f0'; g.fillRect(0, 0, cv.width, cv.height);
  const px = x => (x + W / 2) * S, py = y => (H / 2 - y) * S;
  g.fillStyle = '#e4e4dc'; g.fillRect(0, py(1.2), cv.width, 2.4 * S);
  g.lineWidth = 4; g.strokeStyle = '#d01f2f'; g.beginPath(); g.moveTo(px(-39), py(18.2)); g.lineTo(px(39), py(18.2)); g.stroke();
  g.strokeStyle = '#2a62c9'; g.beginPath(); g.moveTo(px(-39), py(23.8)); g.lineTo(px(39), py(23.8)); g.stroke();
  g.strokeStyle = '#d01f2f'; g.beginPath(); g.moveTo(px(-39), py(-23.8)); g.lineTo(px(39), py(-23.8)); g.stroke();
  g.strokeStyle = '#2a62c9'; g.beginPath(); g.moveTo(px(-39), py(-18.2)); g.lineTo(px(39), py(-18.2)); g.stroke();
  g.fillStyle = '#d01f2f'; g.font = `bold ${3.2 * S}px DejaVu Sans`; g.fillText('+', px(-41.2), py(18.6)); g.fillStyle = '#2a62c9'; g.fillText('−', px(-41.2), py(21.5));
  g.fillStyle = '#3a3a3a';
  const sq = (x, y) => g.fillRect(px(x) - 0.55 * S, py(y) - 0.55 * S, 1.1 * S, 1.1 * S);
  for (let c = 1; c <= 30; c++) { for (const r of 'abcdefghij') sq(colX(c), ROWY[r]);
    for (const y of [19.7, 22.24, -19.7, -22.24]) sq(colX(c), y); }
  g.fillStyle = '#777'; g.font = `${1.9 * S}px DejaVu Sans`;
  for (let c = 1; c <= 30; c += (c === 1 ? 4 : 5)) g.fillText(String(c), px(colX(c)) - 0.8 * S, py(15.9));
  'abcde'.split('').forEach(r => g.fillText(r, px(-40.6), py(ROWY[r]) + 0.7 * S));
  'fghij'.split('').forEach(r => g.fillText(r, px(-40.6), py(ROWY[r]) + 0.7 * S));
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 8; return t;
}
const bb = new THREE.Group(); root.add(bb);
{ const top = new THREE.MeshStandardMaterial({ map: bbTexture(), roughness: .8 });
  const b = new THREE.Mesh(new THREE.BoxGeometry(83, 55, BB_TOP), [M.white, M.white, M.white, M.white, top, M.white]); b.position.z = BB_TOP / 2; bb.add(b); }
// highlight strips
function strip(x0, x1, y, w, color) { const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, w, 0.4), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 }));
  m.position.set((x0 + x1) / 2, y, BB_TOP + 0.25); bb.add(m); return m; }
const HL = { railP: strip(-38, 38, ROWY.P, 1.8, '#ff2a3a'), railN: strip(-38, 38, ROWY.N, 1.8, '#2a6bff'),
  col10: strip(colX(10) - .9, colX(10) + .9, 8.89, 12.5, '#21c065'), col20: strip(colX(20) - .9, colX(20) + .9, -8.89, 12.5, '#21c065') };
HL.col10.geometry = new THREE.BoxGeometry(1.8, 12.3, .4); HL.col10.position.set(colX(10), 8.89, BB_TOP + .25);
HL.col20.geometry = new THREE.BoxGeometry(1.8, 12.3, .4); HL.col20.position.set(colX(20), -8.89, BB_TOP + .25);

// ------------------------------------------------------------------ ESP32 DevKit (30 pins)
// header in row b, USB end at column 1:  col1 VIN, 2 GND, 3 D13, 4 D12, 5 D14, 6 D27, 7 D26, 8 D25, 9 D33, 10 D32, 11 D35, 12 D34, 13 VN, 14 VP, 15 EN
const PIN_B = ['VIN', 'GND', 'D13', 'D12', 'D14', 'D27', 'D26', 'D25', 'D33', 'D32', 'D35', 'D34', 'VN', 'VP', 'EN'];
const PIN_I = ['3V3', 'GND', 'D15', 'D2', 'D4', 'RX2', 'TX2', 'D5', 'D18', 'D19', 'D21', 'RX0', 'TX0', 'D22', 'D23'];
const colOf = name => PIN_B.indexOf(name) + 1;
function espTexture() {
  const S = 14, W = 51.5, H = 28.3, cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S; const g = cv.getContext('2d');
  g.fillStyle = '#1b1d22'; g.fillRect(0, 0, cv.width, cv.height);
  const x0 = colX(1) - colX(8) + W / 2; // pin1 position on the board (board centre = column 8)
  g.font = `bold ${1.55 * S}px DejaVu Sans`; g.textAlign = 'center';
  for (let k = 0; k < 15; k++) { const x = (x0 + k * PITCH) * S;
    const use = ['GND', 'D13', 'D14', 'D27', 'D26', 'D25', 'VIN'].includes(PIN_B[k]);
    g.save(); g.translate(x + .5 * S, (H / 2 - 11.43 + 1.6) * S); g.rotate(-Math.PI / 2); g.textAlign = 'right';
    g.font = `bold ${1.45 * S}px DejaVu Sans`; g.fillStyle = use ? '#ffd27a' : '#cfd6db'; g.fillText(PIN_B[k], 0, 0); g.restore();
    g.save(); g.translate(x + .5 * S, (H / 2 + 11.43 - 1.6) * S); g.rotate(-Math.PI / 2); g.textAlign = 'left';
    g.font = `${1.3 * S}px DejaVu Sans`; g.fillStyle = '#9aa7b0'; g.fillText(PIN_I[k], 0, 0); g.restore();
    g.fillStyle = '#c9a64a'; g.beginPath(); g.arc(x, (H / 2 - 11.43) * S, .75 * S, 0, 7); g.fill(); g.beginPath(); g.arc(x, (H / 2 + 11.43) * S, .75 * S, 0, 7); g.fill(); }
  g.fillStyle = '#fff'; g.font = `${1.5 * S}px DejaVu Sans`; g.textAlign = 'left'; g.fillText('EN', 1.2 * S, (H / 2 - 4.2) * S); g.fillText('BOOT', 1.2 * S, (H / 2 + 6.4) * S);
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 8; return t;
}
const esp = new THREE.Group(); root.add(esp);
const ESP_PCB_Z = 11.5;     // PCB bottom above the breadboard surface when fully inserted (pins in the holes)
{ const tex = espTexture(); const top = new THREE.MeshStandardMaterial({ map: tex, roughness: .6 });
  const pcb = new THREE.Mesh(new THREE.BoxGeometry(51.5, 28.3, 1.6), [M.pcb, M.pcb, M.pcb, M.pcb, top, M.pcb]); pcb.position.set(0, 0, ESP_PCB_Z + .8); esp.add(pcb);
  const can = box(18, 25.5, 3.2, M.metal); can.position.set(12.5, 0, ESP_PCB_Z + 3.2); esp.add(can);
  const ant = box(6, 18, .8, M.black); ant.position.set(23.5, 0, ESP_PCB_Z + 2); esp.add(ant);
  const usb = box(7.5, 9, 3.3, M.metal); usb.position.set(-23.5, 0, ESP_PCB_Z + 3.2); esp.add(usb);
  const bEN = box(3.5, 3, 1.6, M.white); bEN.position.set(-20, 8, ESP_PCB_Z + 2.4); esp.add(bEN); esp.userData.en = bEN;
  const bBOOT = box(3.5, 3, 1.6, M.white); bBOOT.position.set(-20, -8, ESP_PCB_Z + 2.4); esp.add(bBOOT); esp.userData.boot = bBOOT;
  const led = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, .8), M.led); led.position.set(-14, 9.5, ESP_PCB_Z + 2); esp.add(led);
  for (const y of [11.43, -11.43]) { const hdr = box(15 * PITCH, 2.5, 2.5, M.black); hdr.position.set(colX(8) - colX(8), y, ESP_PCB_Z - 1.25); esp.add(hdr);
    for (let k = 0; k < 15; k++) { const p = box(.64, .64, 9, M.gold); p.position.set(colX(k + 1) - colX(8), y, ESP_PCB_Z - 4.5); esp.add(p); } } }
const ESP_IN = new THREE.Vector3(colX(8), 0, -0.0);              // inserted: pins down in rows b / i, columns 1-15
const ESP_TABLE = new THREE.Vector3(-30, -78, -(ESP_PCB_Z - 9.0)); // lying on the table on its pins (before step 1)
const espLocalPin = name => new THREE.Vector3(colX(colOf(name)) - colX(8), 11.43, ESP_PCB_Z);

// ------------------------------------------------------------------ jumper wires
const WIRE = { red: '#d01f2f', black: '#22272b', brown: '#6b4a2b', orange: '#f07c18', yellow: '#e5b800' };
function maleEnd() { const g = new THREE.Group(); const h = box(2.5, 2.5, 13, M.black); h.position.z = 6.5; g.add(h); const p = box(.64, .64, 6, M.gold); p.position.z = -3; g.add(p); return g; }
function femaleEnd() { const g = new THREE.Group(); const h = box(2.6, 2.6, 13, M.black); h.position.z = 6.5; g.add(h); return g; }
const wires = [];
// a = {pos: fn(t)->Vector3 tip point, dir: Vector3 pointing INTO the hole}, appear: [t0, t1] travel from above
function jumper(color, A, B, t0, t1, opts) {
  opts = opts || {};
  const ea = (opts.fa ? femaleEnd() : maleEnd()), eb = (opts.fb ? femaleEnd() : maleEnd());
  root.add(ea); root.add(eb);
  const tube = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({ color: WIRE[color] || color, roughness: .5 }));
  root.add(tube);
  const w = { ea, eb, tube, A, B, t0, t1, lift: opts.lift || 30, sag: opts.sag || 0 };
  wires.push(w); return w;
}
const UP = new THREE.Vector3(0, 0, 1);
function placeEnd(end, tip, dir) {   // end's local -z axis = dir (into the hole), local origin at the housing bottom = tip
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, -1), dir.clone().normalize());
  end.position.copy(tip); end.quaternion.copy(q);
}
function updateWires(t) {
  wires.forEach(w => {
    const vis = t >= w.t0; w.ea.visible = w.eb.visible = w.tube.visible = vis; if (!vis) return;
    const s = ramp(t, w.t0, w.t1);
    const a = w.A.pos(t), b = w.B.pos(t), da = w.A.dir, db = w.B.dir;
    const ta = a.clone().addScaledVector(da, -(1 - s) * 25), tb = b.clone().addScaledVector(db, -(1 - s) * 25);
    placeEnd(w.ea, ta, da); placeEnd(w.eb, tb, db);
    const pa = ta.clone().addScaledVector(da, -13), pb = tb.clone().addScaledVector(db, -13);
    const qa = pa.clone().addScaledVector(da, -8), qb = pb.clone().addScaledVector(db, -8);
    const mid = pa.clone().lerp(pb, .5); mid.z = Math.max(pa.z, pb.z) + w.lift; mid.y -= w.sag;
    const curve = new THREE.CatmullRomCurve3([pa, qa, mid, qb, pb]);
    w.tube.geometry.dispose(); w.tube.geometry = new THREE.TubeGeometry(curve, 40, .85, 8, false);
  });
}
const DOWN = new THREE.Vector3(0, 0, -1);
const inHole = (row, c) => ({ pos: () => hole(row, c), dir: DOWN });

// ------------------------------------------------------------------ servos (MG90S, JR plug, 20 cm lead)
function makeServo() {
  const g = new THREE.Group();
  const body = box(22.8, 12.2, 22.7, M.servo); body.position.set(0, 0, 11.35); g.add(body);
  const tabs = box(32.3, 12.2, 2.5, M.servo); tabs.position.set(0, 0, 15.9 + 1.25); g.add(tabs);
  const boss = cyl(5.9, 4, M.servo); boss.position.set(-5.5, 0, 24.7); g.add(boss);
  const shaft = cyl(2.4, 3, M.white); shaft.position.set(-5.5, 0, 28); g.add(shaft);
  const horn = new THREE.Group(); horn.position.set(-5.5, 0, 29.8); g.add(horn);
  const arm = box(28, 5.5, 1.8, M.white); arm.position.x = 7; horn.add(arm); const hub = cyl(3.6, 2.6, M.white); horn.add(hub);
  g.userData.horn = horn;
  const spool = new THREE.Group(); const f1 = cyl(16, 1.5, M.spool, 48); f1.position.z = .75; spool.add(f1); const core = cyl(13, 5, M.spool, 48); core.position.z = 4; spool.add(core);
  const f2 = cyl(16, 1.5, M.spool, 48); f2.position.z = 7.25; spool.add(f2); spool.visible = false; horn.add(spool); spool.position.z = 1; g.userData.spool = spool;
  return g;
}
function makePlug() { const g = new THREE.Group(); const p = box(7.6, 2.6, 14, M.black); p.position.z = 7; g.add(p); return g; }
const servos = [];
// finger, pin, servo position on the table, plug position (tip of the plug, holes facing +y towards the breadboard)
const SERVO_DEF = [
  { name: 'Index', pin: 'D13', pos: [-20, 92], rail: [12, 13] },
  { name: 'Thumb', pin: 'D25', pos: [-80, 112], rail: [16, 17] },
  { name: 'Middle', pin: 'D14', pos: [40, 112], rail: [20, 21] },
  { name: 'Ring', pin: 'D27', pos: [100, 92], rail: [24, 25] },
  { name: 'Little', pin: 'D26', pos: [-140, 92], rail: [28, 29] },
];
SERVO_DEF.forEach((d, k) => {
  const s = makeServo(); s.position.set(d.pos[0], d.pos[1], 0); s.rotation.z = Math.PI / 2; root.add(s);
  const plug = makePlug(); const pp = new THREE.Vector3(d.pos[0] * 0.55 + colX(colOf(d.pin)) * 0.45, 52, 1.3); plug.position.copy(pp);
  plug.rotation.x = -Math.PI / 2; root.add(plug);   // plug axis along +y: holes at y = 52 + 14
  // cable from the servo to the plug: three thin wires side by side
  const cab = new THREE.Group(); root.add(cab);

  const target = c || prev || lastCam; const from = (s.i > 0 && prev) ? prev : target;
