<!doctype html>
<html><head><meta charset="utf-8"><title>RoboHand: string and elastic</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #e9edf0; font-family: "DejaVu Sans", Arial, sans-serif; }
  canvas { position: absolute; inset: 0; }
  .ov { position: absolute; }
  #part { left: 36px; top: 24px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #c25a17; font-weight: bold; }
  #cap { left: 50%; bottom: 30px; transform: translateX(-50%); width: 1140px; box-sizing: border-box; background: rgba(23,32,38,.9); color: #fff;
         font-size: 23px; line-height: 1.38; padding: 13px 24px; border-radius: 10px; text-align: center; }
  #bar { left: 0; bottom: 0; height: 6px; background: #e8742a; }
  #labels { inset: 0; pointer-events: none; }
  .lab { position: absolute; transform: translate(-50%, -100%); background: #172026; color: #fff; font-size: 18px; font-weight: bold;
         padding: 5px 10px; border-radius: 6px; white-space: nowrap; }
  .lab::after { content: ""; position: absolute; left: 50%; bottom: -16px; width: 2px; height: 16px; background: #172026; transform: translateX(-50%); }
  .lab.red { background: #c9182f; } .lab.red::after { background: #c9182f; }
  .lab.yel { background: #b88700; } .lab.yel::after { background: #b88700; }
  .lab.blu { background: #1f5fbf; } .lab.blu::after { background: #1f5fbf; }
  .lab.grn { background: #2f7d4f; } .lab.grn::after { background: #2f7d4f; }
  #dim { inset: 0; background: rgba(233,237,240,.93); }
  .card { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); width: 940px; background: #fff; border-radius: 14px; padding: 24px 32px;
          box-shadow: 0 10px 40px rgba(0,0,0,.2); color: #172026; font-size: 21px; line-height: 1.45; box-sizing: border-box; }
  .card h2 { margin: 0 0 14px; font-size: 28px; }
  .items { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .item { border: 2px solid #d6dce0; border-radius: 12px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
  .item b { font-size: 22px; } .item .n { background: #e8742a; color: #fff; border-radius: 8px; padding: 4px 10px; font-weight: bold; font-size: 20px; }
  .small { font-size: 17px; color: #5b6873; }
  .step { display: inline-block; text-align: center; width: 200px; vertical-align: top; font-size: 16px; color: #33424c; }
  .step.on { color: #c25a17; font-weight: bold; }
  svg text { font-family: "DejaVu Sans", Arial, sans-serif; }
  #title { inset: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 80px;
           background: linear-gradient(90deg, rgba(233,237,240,.97) 0%, rgba(233,237,240,.9) 50%, rgba(233,237,240,0) 76%); color: #172026; }
  #title h1 { font-size: 56px; margin: 0 0 10px; } #title p { font-size: 24px; margin: 6px 0; max-width: 620px; color: #33424c; }
  #title .tag { font-size: 16px; letter-spacing: .16em; text-transform: uppercase; color: #c25a17; font-weight: bold; margin-bottom: 14px; }
</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="labels" class="ov"></div>
<div id="dim" class="ov"></div>
<div id="cards" class="ov" style="inset:0"></div>
<div id="title" class="ov"></div>
<div id="part" class="ov"></div>
<div id="cap" class="ov"></div>
<div id="bar" class="ov"></div>
<script src="../node_modules/three/build/three.min.js"></script>
<script src="../scene.js"></script>
<script src="timeline.js"></script>
<script>
(function () {
const S = window.SCENE, P = S.params, TL = window.TIMELINE;
const FPS = 15; window.FPS = FPS; window.DURATION = TL.total;
const SC = {}; TL.scenes.forEach((s, i) => { s.i = i; SC[s.id] = s; });
const T0 = id => SC[id].t0;
const V = (id, a) => SC[id].voice[0] + (SC[id].voice[1] - SC[id].voice[0]) * a;
const ease = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const sceneAt = t => { let s = TL.scenes[0]; for (const x of TL.scenes) if (t >= x.t0) s = x; return s; };

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1280, 720, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9edf0');
const camera = new THREE.PerspectiveCamera(28, 16 / 9, 1, 3000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x606a74, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(150, 300, 260); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-200, 100, -150); scene.add(fill);
const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);   // CAD z-up -> three y-up

const b2a = s => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
function geom(e) { const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b2a(e.v)), 3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(b2a(e.i)), 1)); g.computeVertexNormals(); return g; }
const finMat = new THREE.MeshStandardMaterial({ color: '#f0a43a', flatShading: true, roughness: .6, transparent: true, opacity: 1 });
const pinMat = new THREE.MeshStandardMaterial({ color: '#f7f1e0', roughness: .5 });
const lineMat = new THREE.MeshStandardMaterial({ color: '#d7263d', roughness: .5 });
const elaMat = new THREE.MeshStandardMaterial({ color: '#e0a800', roughness: .7 });
const chanThin = new THREE.MeshBasicMaterial({ color: '#d7263d', transparent: true, opacity: 0 });
const chanWide = new THREE.MeshBasicMaterial({ color: '#e0a800', transparent: true, opacity: 0 });
const lipMat = new THREE.MeshBasicMaterial({ color: '#1f5fbf', transparent: true, opacity: 0 });
const table = new THREE.Mesh(new THREE.BoxGeometry(900, 500, 4), new THREE.MeshStandardMaterial({ color: '#d9d3c8', roughness: .95 }));
table.position.set(0, 0, -95); root.add(table);

// ---- finger chain (index), lying along +x, back (+z) up, palm side down
const L = S.fingers.index.L, NAMES = S.fingers.index.bones, C = P.C;
const fz = P.FLEX_Z - P.ZP, ez = P.EXT_Z - P.ZP;
const base = new THREE.Group(); base.position.set(-52, 0, 18); root.add(base);
const joints = []; let parent = base;
L.forEach((Li, i) => { const j = new THREE.Group(); if (i > 0) j.position.x = L[i - 1]; parent.add(j); joints.push(j);
  j.add(new THREE.Mesh(geom(S.geom[NAMES[i]]), finMat)); parent = j; });
// channels (shown as coloured rods when the finger is see-through)
joints.forEach((j, i) => {
  const len = L[i] + (i === L.length - 1 ? 2 : 0);
  const thin = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, len + 8, 16), chanThin); thin.rotation.z = Math.PI / 2; thin.position.set(len / 2, 0, fz); j.add(thin);
  const wide = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, len + 8, 16), chanWide); wide.rotation.z = Math.PI / 2; wide.position.set(len / 2, 0, ez); j.add(wide);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(5.5, 17, 1.8), lipMat); lip.position.set(2.8, 0, 7.4); j.add(lip);
});
// lock pins
const lockPins = joints.map((j, i) => { const p = new THREE.Mesh(new THREE.CylinderGeometry(.9, .9, 17, 12), pinMat); j.add(p); p.userData.x = L[i] / 2; return p; });
// knot
const knot = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 12), new THREE.MeshStandardMaterial({ color: '#a8122a' })); joints[2].add(knot);
const glueDrop = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 12), new THREE.MeshStandardMaterial({ color: '#dff3ff', transparent: true, opacity: .85 })); joints[2].add(glueDrop);

const tubeLine = new THREE.Mesh(new THREE.BufferGeometry(), lineMat); root.add(tubeLine);
const tubeEla = new THREE.Mesh(new THREE.BufferGeometry(), elaMat); root.add(tubeEla);
const P3 = (x, y, z) => new THREE.Vector3(x, y, z);
const W = (obj, x, y, z) => { const v = P3(x, y, z); obj.updateMatrixWorld(true); return v.applyMatrix4(obj.matrixWorld).applyMatrix4(new THREE.Matrix4().copy(root.matrixWorld).invert()); };
function pathPts(zc, tailLen, tipOut) {   // from the fingertip end down to the base, then a tail
  const out = [W(joints[2], L[2] + tipOut, 0, zc)];
  for (let i = L.length - 1; i >= 0; i--) { const j = joints[i]; out.push(W(j, i === L.length - 1 ? L[i] - 1 : L[i] - C, 0, zc), W(j, C, 0, zc)); }
  out.push(W(joints[0], -C, 0, zc), W(joints[0], -C - tailLen, 0, zc - 6));
  return out;
}
function trim(pts, f) {
  if (f >= 1) return pts; const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = pts[i].distanceTo(pts[i - 1]); seg.push(d); tot += d; }
  let want = tot * Math.max(.0001, f); const o = [pts[0]];
  for (let i = 1; i < pts.length; i++) { if (want <= seg[i - 1]) { o.push(pts[i - 1].clone().lerp(pts[i], want / seg[i - 1])); return o; } want -= seg[i - 1]; o.push(pts[i]); }
  return o;
}
function setTube(mesh, pts, r) {
  if (pts.length < 2 || pts[0].distanceTo(pts[pts.length - 1]) < .3) { mesh.visible = false; return; }
  const path = new THREE.CurvePath(); for (let i = 1; i < pts.length; i++) if (pts[i].distanceTo(pts[i - 1]) > 1e-3) path.add(new THREE.LineCurve3(pts[i - 1], pts[i]));
  mesh.geometry.dispose(); mesh.geometry = new THREE.TubeGeometry(path, pts.length * 8, r, 8, false); mesh.visible = true;
}

// ---- cameras: [pos, target] in CAD coords (x along finger, -y = viewer side, z up)
const CAM = {
  intro: [[30, -280, 140], [0, 0, 10]], items: [[30, -280, 140], [0, 0, 10]],
  sides: [[0, -230, 90], [0, 0, 5]], channels: [[0, -200, 70], [0, 0, 18]], tipholes: [[120, -55, 40], [48, 0, 18]],
  cut_line: [[0, -230, 90], [0, 0, 10]], knot: [[0, -230, 90], [0, 0, 10]], stiffen: [[0, -230, 90], [0, 0, 10]],
  thread_in: [[110, -90, 50], [50, 0, 14]], thread_through: [[0, -200, 70], [0, 0, 14]], pull: [[-20, -200, 70], [-20, 0, 14]],
  glue: [[105, -75, 45], [50, 0, 14]], cut_elastic: [[0, -230, 90], [0, 0, 10]], elastic_in: [[0, -200, 75], [0, 0, 20]],
  lock_tip: [[60, -95, 75], [42, 0, 20]], marks: [[0, -230, 90], [0, 0, 10]], stretch: [[0, -230, 90], [0, 0, 10]],
  lock_rest: [[-10, -200, 85], [-10, 0, 20]], check: [[10, -300, 60], [10, 0, -25]], ends: [[-30, -220, 85], [-30, 0, 12]], others: [[30, -280, 140], [0, 0, 10]],
};
const toThree = v => new THREE.Vector3(v[0], v[2], -v[1]);
function setCam(t) {
  const s = sceneAt(t); const cur = CAM[s.id]; const prev = s.i > 0 ? CAM[TL.scenes[s.i - 1].id] : cur;
  const k = ease((t - s.t0) / 1.6); const sway = Math.sin(t * .3) * 6;
  const pos = prev[0].map((v, j) => v + (cur[0][j] - v) * k), tgt = prev[1].map((v, j) => v + (cur[1][j] - v) * k);
  camera.position.copy(toThree([pos[0] + sway, pos[1], pos[2]])); camera.lookAt(toThree(tgt)); camera.updateMatrixWorld();
}

// ---- labels
const labelsEl = document.getElementById('labels');
function project(v) { const p = v.clone().applyMatrix4(root.matrixWorld).project(camera); return [(p.x + 1) / 2 * 1280, (1 - p.y) / 2 * 720, p.z]; }
const LABELS = {
  sides: [['BACK: flat lip at each joint', () => W(joints[1], 3, 0, 12), 'blu'], ['PALM side (finger bends this way)', () => W(joints[1], 18, 0, -16), 'red']],
  channels: [['THIN hole → string', () => W(joints[1], 16, 0, fz - 3), 'red'], ['WIDE hole → elastic', () => W(joints[1], 16, 0, ez + 5), 'yel']],
  tipholes: [['thin hole + knot pocket', () => W(joints[2], L[2] + 1, 0, fz + 1), 'red'], ['wide hole', () => W(joints[2], L[2] - 2, 0, ez + 2), 'yel']],
  thread_in: [['in here: thin hole', () => W(joints[2], L[2] + 2, 0, fz + 2), 'red']],
  thread_through: [['joint gap: bend a little, guide the line in', () => W(joints[1], -1, 0, fz - 2), 'red']],
  pull: [['comes out here, under the tab', () => W(joints[0], -C - 4, 0, fz - 2), 'red']],
  glue: [['one drop of glue on the knot', () => W(joints[2], L[2] + 2, 0, fz + 1), 'grn']],
  elastic_in: [['wide hole on the back', () => W(joints[2], L[2] - 1, 0, ez + 3), 'yel']],
  lock_tip: [['cross hole → pin', () => W(joints[2], L[2] / 2, -9, ez - 1.6), 'grn']],
  lock_rest: [['pin', () => W(joints[1], L[1] / 2, -9, ez - 1.6), 'grn'], ['pin', () => W(joints[0], L[0] / 2, -9, ez - 1.6), 'grn']],
  ends: [['string end', () => W(joints[0], -C - 30, 0, fz - 6), 'red'], ['elastic end', () => W(joints[0], -C - 30, 0, ez - 2), 'yel']],
};
function setLabels(list) { labelsEl.innerHTML = ''; (list || []).forEach(([txt, fn, cls]) => { const d = document.createElement('div'); d.className = 'lab ' + (cls || ''); d.textContent = txt;
  labelsEl.appendChild(d); const [x, y, z] = project(fn()); d.style.left = x + 'px'; d.style.top = (y - 4) + 'px'; d.style.display = z < 1 ? 'block' : 'none'; }); }

// ---- 2-D cards
function knotSVG(step) {
  const st = (k) => step >= k ? '#d7263d' : '#d9dde0';
  const box = (x, k, body, label) => `<g transform="translate(${x},0)"><rect x="0" y="0" width="190" height="130" rx="10" fill="${step === k ? '#fff4ea' : '#f7f8f9'}" stroke="${step === k ? '#e8742a' : '#d6dce0'}" stroke-width="2"/>${body}<text x="95" y="155" text-anchor="middle" font-size="15" fill="${step === k ? '#c25a17' : '#5b6873'}" font-weight="${step === k ? 'bold' : 'normal'}">${label}</text></g>`;
  return `<svg width="880" height="170">
   ${box(0, 1, `<path d="M15 90 H120 C160 90 165 40 130 35 C95 30 90 75 110 95 L175 110" fill="none" stroke="${st(1)}" stroke-width="5"/>`, '1 · make a loop')}
   ${box(220, 2, `<path d="M15 90 H110 C150 90 160 45 128 40 C100 36 95 70 115 88 C125 98 150 70 175 60" fill="none" stroke="${st(2)}" stroke-width="5"/>`, '2 · end through the loop')}
   ${box(440, 3, `<path d="M15 70 H85" stroke="${st(3)}" stroke-width="5"/><circle cx="95" cy="70" r="11" fill="${st(3)}"/><path d="M105 70 H175" stroke="${st(3)}" stroke-width="5"/>`, '3 · pull tight')}
   ${box(660, 4, `<path d="M15 70 H75" stroke="${st(4)}" stroke-width="5"/><circle cx="92" cy="70" r="17" fill="${st(4)}"/><path d="M108 70 H140" stroke="${st(4)}" stroke-width="5"/>`, '4 · second knot on top')}
  </svg>`;
}
function elasticSVG(stretch) {   // stretch 0..1  ->  50 mm .. 75 mm
  const px = 8, a = 60, len = (50 + 25 * stretch) * px;
  return `<svg width="880" height="190"><rect x="30" y="70" width="${len + 120}" height="14" rx="7" fill="#e0a800"/>
   <path d="M${a + 30} 50 V104 M${a + 30 + len} 50 V104" stroke="#172026" stroke-width="5"/>
   <text x="${a + 30 + len / 2}" y="40" text-anchor="middle" font-size="22" fill="#172026" font-weight="bold">${(5 + 2.5 * stretch).toFixed(1)} cm</text>
   ${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => `<path d="M${a + 30 + k * 10 * px} 125 V${k % 5 === 0 ? 145 : 137}" stroke="#5b6873" stroke-width="2"/><text x="${a + 30 + k * 10 * px}" y="165" text-anchor="middle" font-size="14" fill="#5b6873">${k}</text>`).join('')}
   <text x="${a + 30 + 8 * 10 * px + 18}" y="165" font-size="14" fill="#5b6873">cm</text></svg>`;
}
function cards(s, t) {
  const v = (a, b) => ramp(t, V(s.id, a), V(s.id, b));
  switch (s.id) {
    case 'items': return `<div class="card"><h2>What you need for one finger</h2><div class="items">
      <div class="item"><span class="n">1</span><div><b>Braided fishing line, 0.30 mm</b><br><span class="small">"Fishing Line 8x Braided … 0.30 mm" → the STRING</span></div></div>
      <div class="item"><span class="n">2</span><div><b>Rubber cord, 2 mm</b><br><span class="small">"Brotree Rubber Cord 2 mm" → the ELASTIC</span></div></div>
      <div class="item"><span class="n" style="background:#5b6873">+</span><div><b>3 filament pins, 1.7 cm</b><br><span class="small">cut from your printer filament</span></div></div>
      <div class="item"><span class="n" style="background:#5b6873">+</span><div><b>Super glue · scissors · ruler · pen</b><br><span class="small">tape helps too</span></div></div></div></div>`;
    case 'cut_line': return `<div class="card"><h2>Cut 60 cm of braided line</h2><svg width="880" height="90"><path d="M20 45 H860" stroke="#d7263d" stroke-width="5"/>
      <path d="M20 20 V70 M860 20 V70" stroke="#172026" stroke-width="3"/><text x="440" y="30" text-anchor="middle" font-size="22" font-weight="bold">60 cm</text></svg>
      <p class="small" style="margin:6px 0 0">Longer than needed on purpose: the spare end is tied to the servo spool later.</p></div>`;
    case 'knot': { const st = t < V('knot', .2) ? 1 : t < V('knot', .4) ? 2 : t < V('knot', .62) ? 3 : 4;
      return `<div class="card"><h2>A fat double knot at one end</h2>${knotSVG(st)}<p class="small" style="margin:6px 0 0">The double knot is bigger than the 2 mm hole, so it can't pull through.</p></div>`; }
    case 'stiffen': return `<div class="card"><h2>Tip: make the other end stiff</h2><svg width="880" height="110"><path d="M20 55 H700" stroke="#d7263d" stroke-width="5"/>
      <path d="M700 55 H840 L860 48" stroke="#8a1020" stroke-width="7"/><path d="M680 20 Q700 0 720 20 Q700 45 680 20" fill="#9fd8ff"/><text x="770" y="100" text-anchor="middle" font-size="17">2 cm with super glue, cut at an angle</text></svg></div>`;
    case 'cut_elastic': return `<div class="card"><h2>Cut 25 cm of the 2 mm rubber cord</h2><svg width="880" height="90"><rect x="20" y="38" width="820" height="14" rx="7" fill="#e0a800"/>
      <path d="M20 15 V75 M840 15 V75" stroke="#172026" stroke-width="3"/><text x="430" y="28" text-anchor="middle" font-size="22" font-weight="bold">25 cm</text></svg>
      <p class="small" style="margin:6px 0 0">Cut the end at an angle and wrap a little tape around it.</p></div>`;
    case 'marks': return `<div class="card"><h2>Two pen marks, 5 cm apart</h2>${elasticSVG(0)}</div>`;
    case 'stretch': return `<div class="card"><h2>Stretch until the marks are 7.5 cm apart</h2>${elasticSVG(v(.15, .75))}</div>`;
    default: return '';
  }
}
const el = id => document.getElementById(id);
const PIN_START = 26;

window.renderAt = function (t) {
  const s = sceneAt(t); const id = s.id;
  // see-through finger while showing the holes and threading
  const xr = ['channels', 'tipholes', 'thread_in', 'thread_through', 'pull', 'elastic_in', 'lock_tip', 'lock_rest'].includes(id) ? 0.38 : 1;
  finMat.opacity = xr; finMat.depthWrite = xr === 1;
  chanThin.opacity = ['channels', 'tipholes', 'thread_in'].includes(id) ? 0.55 : 0;
  chanWide.opacity = ['channels', 'tipholes', 'elastic_in'].includes(id) ? 0.55 : 0;
  lipMat.opacity = id === 'sides' ? 0.6 + 0.3 * Math.sin(t * 5) : 0;
  // bending: demo in "sides", small wiggle while threading, curl in "check"
  let curl = 0;
  if (id === 'sides') curl = 35 * Math.sin(Math.PI * ramp(t, V('sides', .55), V('sides', 1)));
  if (id === 'thread_through') curl = 12 * Math.sin(Math.PI * ramp(t, V('thread_through', .2), V('thread_through', .7)));
  if (id === 'check') curl = t < V('check', .45) ? 30 * Math.sin(Math.PI * ramp(t, V('check', .05), V('check', .4))) : 40 * Math.sin(Math.PI * ramp(t, V('check', .55), V('check', 1)));
  if (id === 'intro' || id === 'others') curl = 20 + 15 * Math.sin(t * .8);
  joints.forEach(j => j.rotation.y = THREE.MathUtils.degToRad(curl));
  root.updateMatrixWorld(true);
  // string
  let sf = 0, tip = 25;
  if (t >= T0('thread_in')) sf = 0.12 * ramp(t, V('thread_in', .2), V('thread_in', .9));
  if (t >= T0('thread_through')) sf = 0.12 + 0.68 * ramp(t, V('thread_through', .05), V('thread_through', .95));
  if (t >= T0('pull')) { sf = 0.8 + 0.2 * ramp(t, V('pull', .05), V('pull', .4)); tip = 25 * (1 - ramp(t, V('pull', .4), V('pull', .9))); }
  if (t >= T1x('pull')) { sf = 1; tip = 0; }
  const lineVisible = t >= T0('thread_in') && !['cut_elastic', 'marks', 'stretch'].includes(id);
  if (lineVisible) setTube(tubeLine, trim(pathPts(fz, 40, 3 + tip), sf), .45); else tubeLine.visible = false;
  // knot follows the line into the pocket
  knot.visible = lineVisible || id === 'glue'; knot.position.set(L[2] + 2.2 + tip, 0, fz);
  glueDrop.visible = t >= V('glue', .25) && !['marks', 'stretch', 'cut_elastic'].includes(id); glueDrop.position.set(L[2] + 3.4, 0, fz + 1.2);
  // elastic
  let ef = 0;
  if (t >= T0('elastic_in')) ef = ramp(t, V('elastic_in', .1), V('elastic_in', .95));
  const elaVisible = t >= T0('elastic_in') && !['marks', 'stretch'].includes(id);
  if (elaVisible) setTube(tubeEla, trim(pathPts(ez, 30, 1), ef), .9); else tubeEla.visible = false;
  // lock pins slide in from the viewer side
  const pinT = [ramp(t, V('lock_rest', .55), V('lock_rest', .8)), ramp(t, V('lock_rest', .35), V('lock_rest', .6)), ramp(t, V('lock_tip', .3), V('lock_tip', .75))];

  else if (id === 'others') { ti.style.opacity = ramp(t, s.t0 + .5, s.t0 + 1.5); ti.innerHTML = '<div class="tag">Done</div><h1>One finger ready</h1><p>Repeat for the other four. Thumb: 2 lock pins.</p>'; }
